# Production overrides for the public demo (one small VM behind Caddy, see
# github.com/kabilaymen/quorum/tree/main/deploy/edge):
#   docker network create edge   # once
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Nothing is published on the host: MQTT, Kafka and Prometheus stay private and
# only Grafana (read-only) is reachable, through Caddy.

x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

services:
  mosquitto:
    ports: !reset []
    restart: unless-stopped
    mem_limit: 64m
    logging: *logging

  kafka:
    ports: !reset []
    environment:
      # The external listener only served the host in development.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_HEAP_OPTS: -Xms384m -Xmx384m
      KAFKA_LOG_RETENTION_HOURS: 6
      KAFKA_LOG_RETENTION_BYTES: 104857600
      # Retention only deletes closed segments. With the defaults (1 GiB
      # segments, rolled every 7 days) nothing ever closed at this traffic and
      # the log reached 3.6 GB; small, hourly segments make retention real.
      KAFKA_LOG_SEGMENT_BYTES: 16777216
      KAFKA_LOG_ROLL_HOURS: 1
    restart: unless-stopped
    mem_limit: 768m
    logging: *logging

  gateway:
    image: ghcr.io/kabilaymen/vigil-gateway:latest # built by CI
    ports: !reset []
    mem_limit: 64m
    logging: *logging

  detector:
    image: ghcr.io/kabilaymen/vigil-detector:latest # built by CI
    ports: !reset []
    mem_limit: 64m
    logging: *logging

  simulator:
    image: ghcr.io/kabilaymen/vigil-simulator:latest # built by CI
    mem_limit: 128m
    logging: *logging

  timescaledb:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?set it in .env}
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=20"]
    restart: unless-stopped
    mem_limit: 384m
    logging: *logging

  processor:
    image: ghcr.io/kabilaymen/vigil-processor:latest # built by CI
    ports: !reset []
    environment:
      GOMEMLIMIT: 96MiB # let the GC work against the container limit
    mem_limit: 128m
    logging: *logging

  prometheus:
    ports: !reset []
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      # Dashboards are public: cap what a single query may cost.
      - --query.timeout=10s
      - --query.max-samples=5000000
    volumes:
      - prometheus:/prometheus
    restart: unless-stopped
    mem_limit: 256m
    logging: *logging

  grafana:
    ports: !reset []
    environment:
      GF_SERVER_ROOT_URL: https://vigil.aymenkabil.me
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set it in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/detector.json
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?set it in .env}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_AUTH_ANONYMOUS_HIDE_VERSION: "true"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_METRICS_ENABLED: "false"
    restart: unless-stopped
    mem_limit: 256m
    logging: *logging
    networks:
      default: {}
      edge:
        aliases: [vigil-grafana]

volumes:
  prometheus:

networks:
  edge:
    external: true
