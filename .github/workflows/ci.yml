name: ci
on:
  push:
  pull_request:
jobs:
  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
      - run: go vet ./...
      - run: go test -race ./...
  detector:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: detector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: detector/go.mod
      - run: go vet ./...
      - run: go test -race ./...
  processor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: processor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: processor/go.mod
      - run: go vet ./...
      - run: go test -race ./...
  simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff -r simulator/requirements.txt
      - run: ruff check simulator
      - run: python -m py_compile simulator/simulator.py
  # Built here and pulled by the demo VM, which is too small to compile
  # without disturbing what it runs.
  images:
    needs: [gateway, detector, processor, simulator]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          for svc in gateway detector processor simulator; do
            docker build -t ghcr.io/kabilaymen/vigil-$svc:${{ github.sha }} -t ghcr.io/kabilaymen/vigil-$svc:latest               --label org.opencontainers.image.source=https://github.com/kabilaymen/vigil ./$svc
          done
      - name: Publish to GHCR (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for svc in gateway detector processor simulator; do docker push --all-tags ghcr.io/kabilaymen/vigil-$svc; done
