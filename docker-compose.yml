name: vigil

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    ports:
      - "1883:1883"
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  gateway:
    build: ./gateway
    environment:
      MQTT_URL: tcp://mosquitto:1883
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: telemetry
      METRICS_ADDR: ":9100"
    ports:
      - "9100:9100"
    depends_on:
      mosquitto:
        condition: service_started
      kafka:
        condition: service_healthy
    restart: unless-stopped

  detector:
    build: ./detector
    environment:
      KAFKA_BROKERS: kafka:9092
      PHI_THRESHOLD: "8"
    ports:
      - "9101:9101"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  simulator:
    build: ./simulator
    command: ["--broker", "mosquitto", "--machines", "50", "--rate", "2", "--crash-every", "45", "--stall-every", "30"]
    depends_on:
      - mosquitto
      - gateway
    restart: unless-stopped

  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: vigil
      POSTGRES_DB: vigil
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vigil}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana}
      TS_TUNE_MEMORY: 256MB
    ports:
      - "5432:5432"
    volumes:
      # One file, not the whole directory: that would hide the image's own
      # init scripts, including the one that installs the extension.
      - ./deploy/timescaledb/10-grafana-role.sh:/docker-entrypoint-initdb.d/010_grafana_role.sh:ro
      - timescaledb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigil -d vigil"]
      interval: 5s
      timeout: 5s
      retries: 20

  processor:
    build: ./processor
    environment:
      KAFKA_BROKERS: kafka:9092
      DATABASE_URL: postgres://vigil:${POSTGRES_PASSWORD:-vigil}@timescaledb:5432/vigil
    ports:
      - "9102:9102"
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.5
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:12.4.13
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana}
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  timescaledb:
